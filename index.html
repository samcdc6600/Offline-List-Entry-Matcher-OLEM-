<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Samuel G Brown">
    <title>Offline List Entry Matcher 2000</title>
    <link rel="stylesheet" href="sBStyle.css">
    <script src="superScript.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="headerTitle">OLEM 2000</h1>
    </header>
    <!-- ====================================== MAIN START ===================================== -->
    <main>
      <!-- First list (Matched List) =========================================================== -->
      <section class="leftPanel panelWrapper">
	<div class="panelTop">
	  <h2 class="panelHeader">Matched List</h2>
	  <div class="panelControlsCluster">
	    <button class="tableControlsButton"
		    title="Save matched list to a file with TSV or CSV format (which format is used is defined by which option is set in the candidate list controls area)."
		    onclick="saveMatchedList()">
	      Save List
	    </button>
	  </div>
	</div>
	<div class="panelList" id="matchedListContainerId">
	  <div class="toTopOfListButton">
	  <button class="tableControlsButton tableToTopButton" onclick="scrollToIdOnClick(this)">
	    To Top of List
	  </button>
	  </div>
	</div>
	<div class="panelBottom">
	  <div class="panelBottomInfo" id="matchedListCountInfoId"></div>
	</div>
      </section>
      <!-- Second list (Candidate List) ======================================================== -->
      <section class="rightPanel panelWrapper">
	<div class="panelTop">
	  <h2 class="panelHeader">Candidate List</h2>
	  <div class="panelControlsCluster">
	    <button class="tableControlsButton tooltip" id="openFileButtonId"
		    title="Open a file and interpret it as TSV- or CSV-separated table.">
	      Open File
	    </button>
	    <button class="tableControlsButton tooltip" id="lTDIAButtonId"
		    title="Load Table Data (TSV or CSV) from Input Area (on the right)."
		    onclick="loadTableDataFromInputArea()">
	      LTDIA
	    </button>
	    <textarea class="textInputField tsvCsvDataTextInputField"
		      autocomplete="off" placeholder="...or enter table data here"
		      id="tSVInputFieldId"></textarea>
	    <input class="textInputField" type="text" id="matchCandidateInputFieldId"
	    	   autocomplete="off" placeholder="Enter match candidate...">
	  </div>
	  <div class="panelControlsCluster">
	    <form class="panelControlsClusterRadioButtonsCheckBox">
	      <label class="radioButtonLabel"
		     title="Set the input and output file formats to tab-separated values.">
		<!-- "\u0009" is the UTF16 code for '\t' (which is the same as the ASCII code
		     for it). -->
		<input type="radio" name="delimiterSelectorRadio" value="TSV"
		       onclick="setInputOutputDataTypeTo('\u0009')"
		       checked>
		<span>TSV</span>
	      </label>
	      <label class="radioButtonLabel"
		     title="Set the input and output file formats to comma-separated values.">
		<input type="radio" name="delimiterSelectorRadio" value="CSV"
		       onclick="setInputOutputDataTypeTo(',')">
		<span>CSV</span>
	      </label>
	      <label class="checkboxLabel"
		     title="Only show unmatched entries...">
		<input type="checkbox" id="onlyShowUnmatchedEntriesId"
		       onclick="toggleHideMatchingCandidateRows()" checked>
		Only show unmatched entries 
	      </label>
	    </form>
	  </div>
	</div>
	<div class="panelList" id="candidateTableContainerId">
	  <div class="toTopOfListButton">
	    <button class="tableControlsButton tableToTopButton" onclick="scrollToIdOnClick(this)">
	      To Top of List
	    </button>
	  </div>
	</div>
	<div class="panelBottom">
	  <div class="panelBottomInfo" id="candidateListCountInfoId"></div>
	</div>
      </section>
    </main>
    <!-- ======================================= MAIN END ====================================== -->
    <footer>
      <p class="footer-tex"><small>&copy; SB Macro Corp 2026</small></p>
    </footer>
  </body>
</html>
