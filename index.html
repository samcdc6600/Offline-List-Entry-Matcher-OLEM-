<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Samuel G Brown">
    <title>Offline List Entry Matcher 2000</title>
    <link rel="stylesheet" href="sBStyle.css">
    <script src="superScript.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="headerTitle">OLEM 2000</h1>
    </header>
    <!-- ====================================== MAIN START ===================================== -->
    <main>
      <!-- First list (Candidate List) ========================================================= -->
      <section class="leftPanel panelWrapper">
	<div class="panelTop">
	  <h2 class="panelHeader">Matched List</h2>

	  
	  <div class="panelControlsCluster">
	    <button class="tableControlsButton" onclick="scrollToIdOnClick(this)">
	      Save List
	    </button>
	  </div>
	  
	  <p>I love this stuff you know what I mean I just don't really know.</p>
	</div>
	<div class="panelList">
	  <div class="toTopOfListButton">
	  <button class="tableControlsButton tableToTopButton" onclick="scrollToIdOnClick(this)">
	    To Top of List
	  </button>
	  </div>
	</div>
      </section>
      <!-- Second list (Matched List) ========================================================== -->
      <section class="rightPanel panelWrapper">
	<div class="panelTop">
	  <h2 class="panelHeader">Candidate List</h2>

	  
	  <div class="panelControlsCluster">
	    <button class="tableControlsButton" id="openFileButtonId">
	      Open File
	    </button>
	    <input class="textInputField" type="text" id="matchCandidateInputFieldId"
		   autocomplete="off" placeholder="Enter match candidate...">
	  </div>

	  
	</div>
	<div class="panelList" id="candidateTableContainerId">
	  <div class="toTopOfListButton">
	    <button class="tableControlsButton tableToTopButton" onclick="scrollToIdOnClick(this)">
	      To Top of List
	    </button>
	  </div>
	</div>
      </section>
    </main>
    <!-- ======================================= MAIN END ====================================== -->
    <footer>
      <p class="footer-tex"><small>&copy; SB Macro Corp 2026</small></p>
    </footer>
  </body>
</html>
